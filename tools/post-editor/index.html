<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Criador de posts — Wolff's Room</title><style>
:root{color-scheme:dark;font:15px system-ui;background:#101010;color:#eee}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px}h1{margin:0 0 6px}p{color:#aaa}.bar{position:sticky;top:0;background:#101010eF;padding:12px 0;z-index:3;display:flex;gap:10px}button{border:0;border-radius:6px;padding:12px 18px;font-weight:800;cursor:pointer;background:#c11b25;color:#fff}.secondary{background:#333}section{background:#1a1a1a;border:1px solid #303030;border-radius:9px;padding:22px;margin:16px 0}h2{font-size:18px;margin-top:0;color:#e14a53}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}label{display:grid;gap:6px;color:#bbb;font-size:13px}input,textarea,select{width:100%;background:#0c0c0c;color:#fff;border:1px solid #3a3a3a;border-radius:5px;padding:10px}textarea{min-height:90px;resize:vertical}.hint{font-size:12px;color:#777}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.row.progress{grid-template-columns:1fr 110px 1fr auto}.remove{padding:8px 12px;background:#5b2024}.status{padding:12px;border-radius:6px;display:none}.ok{display:block;background:#173d24}.bad{display:block;background:#531d22}@media(max-width:700px){.grid,.row,.row.progress{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap"><h1>Criador de posts</h1><p>Preencha visualmente, anexe as imagens e gere o arquivo diretamente no projeto.</p><div class="bar"><button id="save">Gerar publicação</button><button class="secondary" id="sample" type="button">Preencher exemplo</button></div><div id="status" class="status"></div><form id="form">
<section><h2>Identificação</h2><div class="grid"><label>Título<input name="title" required></label><label>Slug<input name="slug" placeholder="the-wolf-among-us"></label><label>Categoria<select name="category"><option value="traducoes">Traduções</option><option value="mods">Mods</option><option value="ports">Ports</option><option value="analises">Análises</option></select></label><label>Subseção<input name="section" placeholder="De Outras Equipes"></label><label class="full">Caminho público<input name="path" required placeholder="Traduções/De Outras Equipes/the-wolf-among-us"><span class="hint">Será usado depois de /Posts/</span></label><label class="full">Resumo<textarea name="description" required></textarea></label><label>Autor<input name="author" value="Wolff"></label><label>Data<input type="date" name="date" required></label><label>Plataforma<input name="platform" value="PSVITA"></label><label>Status<input name="postStatus" value="Finalizada"></label><label class="full">Tags (uma por linha)<textarea name="tags"></textarea></label><label>Capa por URL<input name="coverUrl"></label><label>ou anexar capa<input type="file" name="coverFile" accept="image/*"></label></div></section>
<section><h2>Apresentação e jogo</h2><div class="grid"><label class="full">Apresentação (um parágrafo por linha vazia)<textarea name="presentation"></textarea></label><label>Título do jogo<input name="gameTitle"></label><label>Desenvolvedora<input name="developer"></label><label>Publicadora<input name="publisher"></label><label>Gênero<input name="genre"></label><label>Lançamento<input name="release"></label><label>Title ID<input name="titleId"></label><label>Versão<input name="version"></label><label>Idioma<input name="language" value="Português brasileiro"></label></div></section>
<section><h2>Projeto</h2><div class="grid"><label>Logo por URL<input name="projectLogoUrl"></label><label>ou anexar logo<input type="file" name="projectLogoFile" accept="image/*"></label><label class="full">Introdução do projeto<textarea name="projectIntro"></textarea></label><label>Créditos (um por linha)<textarea name="credits"></textarea></label><label>Agradecimentos (um por linha)<textarea name="thanks"></textarea></label><label class="full">Observações (uma por linha)<textarea name="observations"></textarea></label></div></section>
<section><h2>Andamento</h2><div id="progress" class="rows"></div><button type="button" data-add="progress">+ Item de andamento</button></section>
<section><h2>Galeria</h2><label>Selecione várias imagens<input type="file" name="galleryFiles" accept="image/*" multiple></label><label>URLs adicionais (uma por linha)<textarea name="galleryUrls"></textarea></label></section>
<section><h2>Instalação</h2><div class="grid"><label>Etapas (uma por linha)<textarea name="installation"></textarea></label><label>Avisos (um por linha)<textarea name="installationNotes"></textarea></label></div></section>
<section><h2>Downloads</h2><div id="downloads" class="rows"></div><button type="button" data-add="downloads">+ Espelho de download</button></section>
<section><h2>Ferramentas</h2><div id="tools" class="rows"></div><button type="button" data-add="tools">+ Ferramenta</button></section>
</form></div><script>
const $=s=>document.querySelector(s), lines=n=>(n||'').split(/\n+/).map(x=>x.trim()).filter(Boolean), paras=n=>(n||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
const read=f=>new Promise((ok,bad)=>{if(!f)return ok('');const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=bad;r.readAsDataURL(f)});
function add(type,v={}){const box=document.createElement('div');box.className='row '+(type==='progress'?'progress':'');box.innerHTML=type==='progress'?`<input placeholder="Item" value="${v.label||''}"><input type="number" min="0" max="100" placeholder="%" value="${v.percent??100}"><input placeholder="Detalhe" value="${v.detail||''}"><button type="button" class="remove">×</button>`:`<input placeholder="Nome" value="${v.label||''}"><input type="url" placeholder="https://..." value="${v.url||''}"><button type="button" class="remove">×</button>`;box.querySelector('button').onclick=()=>box.remove();$('#'+type).append(box)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));add('progress',{label:'Conclusão total',percent:100});add('downloads');add('tools');
const rowData=id=>[...$('#'+id).children].map(r=>{const i=r.querySelectorAll('input');return id==='progress'?{label:i[0].value,percent:Number(i[1].value),detail:i[2].value||undefined}:{label:i[0].value,url:i[1].value}}).filter(x=>x.label&&(id==='progress'||x.url));
$('#save').onclick=async e=>{e.preventDefault();const f=new FormData($('#form')), files=[...f.getAll('galleryFiles')].filter(x=>x.size);const cover=await read(f.get('coverFile'))||f.get('coverUrl');const logo=await read(f.get('projectLogoFile'))||f.get('projectLogoUrl');const gallery=[...(await Promise.all(files.map(async x=>({src:await read(x),alt:x.name})))),...lines(f.get('galleryUrls')).map(src=>({src,alt:''}))];const post={slug:f.get('slug'),path:f.get('path'),title:f.get('title'),description:f.get('description'),category:f.get('category'),section:f.get('section'),author:f.get('author'),date:f.get('date'),cover,platform:f.get('platform'),status:f.get('postStatus'),tags:lines(f.get('tags')),featured:false,draft:false,presentation:paras(f.get('presentation')),game:{title:f.get('gameTitle')||f.get('title'),developer:f.get('developer'),publisher:f.get('publisher'),genre:f.get('genre'),release:f.get('release'),titleId:f.get('titleId'),version:f.get('version'),language:f.get('language')},projectLogo:logo||undefined,projectIntro:paras(f.get('projectIntro')),credits:lines(f.get('credits')),thanks:lines(f.get('thanks')),observations:lines(f.get('observations')),extras:[],progress:rowData('progress'),gallery,installation:lines(f.get('installation')),installationNotes:lines(f.get('installationNotes')),downloads:rowData('downloads'),tools:rowData('tools')};const s=$('#status');s.className='status';s.textContent='Salvando...';try{const r=await fetch('/api/save',{method:'POST',body:JSON.stringify(post)}),j=await r.json();if(!r.ok)throw Error(j.error);s.className='status ok';s.textContent=`Pronto: ${j.file} — endereço ${j.url}`;}catch(x){s.className='status bad';s.textContent=x.message}};
$('#sample').onclick=()=>{const f=$('#form');f.title.value='Novo projeto [PSVITA]';f.slug.value='novo-projeto';f.path.value='Traduções/Em Andamento/novo-projeto';f.description.value='Descrição curta da publicação.';f.date.value=new Date().toISOString().slice(0,10);f.gameTitle.value='Novo projeto';f.presentation.value='Primeiro parágrafo da apresentação.\n\nSegundo parágrafo.'};
</script></body></html>
